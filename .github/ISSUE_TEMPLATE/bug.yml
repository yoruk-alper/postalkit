name: Bug
description: A crash, a type error, a packaging or bundling problem.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A minimal snippet that shows it, and the error if there is one.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: postalkit 0.2.0, Node 22 / Chrome 140, bundler and version
    validations:
      required: true
