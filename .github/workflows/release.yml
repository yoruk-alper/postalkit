name: Release

# Push a tag matching package.json (git tag v0.2.0 && git push --tags) to publish to npm.
# Needs an NPM_TOKEN secret, or npm trusted publishing configured for this workflow
# (then NODE_AUTH_TOKEN can be removed). npm only attests provenance for public
# repositories, so --provenance is added once the repository is public.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public ${{ github.event.repository.private && ' ' || '--provenance' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
