name: Release

# Push a tag matching package.json (git tag v0.3.0 && git push --tags) to publish to npm.
# Publishes through npm trusted publishing (configured for this workflow on npmjs.com),
# so no token is needed and npm attests provenance automatically. The GitHub release
# notes are the version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
      - name: Create the GitHub release
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "postalkit ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
