name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (data, types, build, tests, size, package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated files are committed
        run: git diff --exit-code
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: postalkit-*.tgz

  consumers:
    # What users run: the packed tarball, installed into a fresh project, on every supported Node.
    name: Consumer on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [14, 16, 18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tarball into a fresh project
        run: |
          mkdir consumer
          cd consumer
          echo '{"name":"consumer","private":true}' > package.json
          npm install ../postalkit-*.tgz
          cp ../test/smoke.cjs ../test/smoke.mjs .
      - run: node smoke.cjs
        working-directory: consumer
      - run: node smoke.mjs
        working-directory: consumer

  browsers:
    # The packed package in Chromium, Firefox and WebKit: native ES modules, Vite, and webpack (ESM and CommonJS).
    name: Browsers and bundlers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/browser/package-lock.json
      - run: npm ci
      - run: npm ci --prefix test/browser
      - run: npx --prefix test/browser playwright install --with-deps chromium firefox webkit
        timeout-minutes: 8 # an apt mirror or the browser CDN can hang
      - run: npm run test:browser
