name: Pages

# Publishes the playground (/playground/) and the API reference (/api/) to GitHub Pages.
# Enable Pages with "GitHub Actions" as the source in the repository settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R playground dist _site/
          cp -R docs _site/api
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=playground/"><a href="playground/">postalkit playground</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
