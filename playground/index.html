<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>postalkit playground</title>
<meta name="description" content="Try postalkit: validate and format postal codes for 252 countries, as you type.">
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4;
    --accent: #2563eb; --ok: #15803d; --ok-bg: #f0fdf4; --bad: #b91c1c; --bad-bg: #fef2f2; --wait: #a16207; --wait-bg: #fefce8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e; --border: #292524;
      --accent: #60a5fa; --ok: #4ade80; --ok-bg: #052e16; --bad: #f87171; --bad-bg: #2b0b0b; --wait: #facc15; --wait-bg: #2a2205;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 + p { margin: 0 0 28px; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  a { color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  label small { font-weight: 400; color: var(--muted); }
  select, input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input { font-family: var(--mono); font-size: 18px; letter-spacing: 0.04em; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .status b { font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  .status.complete { background: var(--ok-bg); color: var(--ok); }
  .status.partial { background: var(--wait-bg); color: var(--wait); }
  .status.invalid { background: var(--bad-bg); color: var(--bad); }
  .status.idle { background: var(--bg); color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); font-family: var(--mono); }
  dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; color: var(--text); font-family: inherit; }
  .chip:hover { border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 14px; }
  .examples { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .examples button { font-family: var(--mono); }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>postalkit</h1>
  <p>Validate and format postal codes for 252 countries. Type anything people actually type.</p>

  <section class="card">
    <div class="fields">
      <div>
        <label for="country">Country</label>
        <select id="country"></select>
      </div>
      <div>
        <label for="code" id="code-label">Postal code</label>
        <input id="code" autocomplete="postal-code" spellcheck="false" autocapitalize="characters">
      </div>
    </div>
    <div class="status idle" id="status" role="status" aria-live="polite"></div>
    <div class="examples">Try: <span class="chips" id="examples" style="display:inline-flex"></span></div>
  </section>

  <section class="card">
    <h2>parse(country, code)</h2>
    <dl id="parse"></dl>
  </section>

  <section class="card" id="regions-card">
    <h2>findRegions(country, code) <span class="muted">· postalkit/regions</span></h2>
    <div id="regions"></div>
  </section>

  <section class="card">
    <h2>getCountryInfo(country)</h2>
    <dl id="info"></dl>
  </section>

  <footer>
    Postal data derived from Google libaddressinput (CC-BY 4.0). <a href="../api/">API reference</a>
  </footer>
</main>

<script type="module">
  import { getCountries, getCountryInfo, getCountryName, parse } from "../dist/index.js";
  import { findRegions, hasRegionData } from "../dist/regions.js";
  import { checkPartial, parseTyped } from "../dist/partial.js";
  import { getErrorMessage } from "../dist/messages.js";

  const $ = (id) => document.getElementById(id);
  const country = $("country");
  const code = $("code");
  const EXAMPLES = [["GB", "sw1a1aa"], ["US", "902101234"], ["JP", "１００－０００１"], ["IR", "۱۱۹۳۶۱۲۳۴۵"], ["SE", "SE-114 55"], ["CA", "k1a-0t6"], ["LV", "1050"], ["US", "9021O"], ["GB", "QQ1"], ["AR", ""], ["AE", ""]];

  const names = getCountries()
    .map((c) => [c, getCountryName(c)])
    .sort((a, b) => a[1].localeCompare(b[1]));
  for (const [c, name] of names) country.append(new Option(`${name} (${c})`, c));
  const fromLocale = (navigator.language.split("-")[1] || "").toUpperCase();
  country.value = getCountryInfo(fromLocale) ? fromLocale : "US";

  function rows(dl, entries) {
    dl.replaceChildren(...entries.flatMap(([k, v]) => {
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = k;
      dd.textContent = typeof v === "string" ? JSON.stringify(v) : String(v);
      return [dt, dd];
    }));
  }

  function chip(text, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = text;
    b.addEventListener("click", onClick);
    return b;
  }

  function setCountry() {
    const info = getCountryInfo(country.value);
    $("code-label").innerHTML = "";
    $("code-label").append(info.hasPostalCode ? info.label[0].toUpperCase() + info.label.slice(1) : "Postal code");
    if (info.hasPostalCode && !info.required) {
      const s = document.createElement("small");
      s.textContent = " (optional)";
      $("code-label").append(s);
    }
    code.placeholder = info.hasPostalCode ? info.example : "Not used in this country";
    code.inputMode = info.numeric ? "numeric" : "text";
    code.maxLength = info.inputMaxLength || 20;
    rows($("info"), Object.entries(info));
    update();
  }

  function update() {
    const c = country.value;
    const v = code.value;
    const status = checkPartial(c, v);
    const el = $("status");
    el.className = "status " + (v ? status : "idle");
    const text =
      !v ? (!getCountryInfo(c).hasPostalCode ? "Nothing to enter: this country has no postal codes."
        : getCountryInfo(c).required ? "Start typing." : "Optional here: an empty field is valid.")
      : status === "complete" ? `Valid. Stored as ${parse(c, v).value}.`
      : status === "partial" ? "Keep typing…"
      : getErrorMessage(parseTyped(c, v));
    el.innerHTML = "";
    const b = document.createElement("b");
    b.textContent = v ? status : "";
    el.append(b, document.createTextNode(text));

    const r = parse(c, v);
    rows($("parse"), Object.entries(r));

    const regions = $("regions");
    if (!hasRegionData(c)) regions.innerHTML = `<span class="muted">No region data for this country (available for 23).</span>`;
    else {
      const found = findRegions(c, v);
      regions.replaceChildren(found.length
        ? Object.assign(document.createElement("div"), { className: "chips" })
        : Object.assign(document.createElement("span"), { className: "muted", textContent: r.valid ? "No region owns this code." : "Enter a valid code." }));
      for (const reg of found) {
        const s = document.createElement("span");
        s.className = "chip";
        s.textContent = reg.code ? `${reg.name} (${c}-${reg.code})` : reg.name;
        regions.firstChild.append(s);
      }
    }
  }

  for (const [c, v] of EXAMPLES) {
    $("examples").append(chip(`${c} ${v ? JSON.stringify(v) : '""'}`, () => { country.value = c; code.value = v; setCountry(); code.focus(); }));
  }
  country.addEventListener("change", setCountry);
  code.addEventListener("input", update);
  code.addEventListener("blur", () => {
    const r = parse(country.value, code.value);
    if (r.valid && code.value) { code.value = r.value; update(); }
  });
  setCountry();
</script>
</body>
</html>
